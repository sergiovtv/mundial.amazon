name: mundial-development

services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile
    container_name: mundial-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
      MUNDIAL_APP_USER: ${DB_USER}
      MUNDIAL_APP_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5434}:5432"
    volumes:
      - mundial_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ../..
      dockerfile: docker/application/Dockerfile
    container_name: mundial-dev-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ../../public:/var/www/html/public
      - ../../src:/var/www/html/src
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/healthz.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  mundial_dev_pgdata:
