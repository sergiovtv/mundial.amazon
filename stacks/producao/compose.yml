name: mundial-production

services:
  app:
    build:
      context: ../..
      dockerfile: docker/application/Dockerfile
    container_name: mundial-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MEDIA_BASE_URL: /fotos
      PHOTO_ORIGINAL_ROOT: /var/www/html/public/fotos
      PHOTO_CACHE_ROOT: /var/www/html/public/cache
      PHOTO_WATERMARK_FILE: /var/www/html/public/img/watermark-mundial.png
      APP_URL: ${APP_URL:-https://mundialimoveis.com.br}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: imobi
      DB_USER: ${MUNDIAL_APP_USER}
      DB_PASSWORD: ${MUNDIAL_APP_PASSWORD}
      CLIENT_DB_NAME: cliente
      CLIENT_DOCUMENT_ROOT: /var/lib/mundial/documentos
      BOLETO_API_BASE_URL: ${BOLETO_API_BASE_URL:-http://177.200.69.64:9090/sistema/api/site_api.php}
      BOLETO_API_COMPANY: ${BOLETO_API_COMPANY:-sm}
      BOLETO_API_ROUTINE: ${BOLETO_API_ROUTINE:-pdf_boleto_sicredi}
      ZAP_LEAD_KEY: ${ZAP_LEAD_KEY:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.mundial.rule=Host(`mundialimoveis.com.br`) || Host(`www.mundialimoveis.com.br`)
      - traefik.http.routers.mundial.entrypoints=websecure
      - traefik.http.routers.mundial.tls=true
      - traefik.http.routers.mundial.middlewares=mundial-www
      - traefik.http.middlewares.mundial-www.redirectregex.regex=^https://www\.mundialimoveis\.com\.br/(.*)
      - traefik.http.middlewares.mundial-www.redirectregex.replacement=https://mundialimoveis.com.br/$${1}
      - traefik.http.middlewares.mundial-www.redirectregex.permanent=true
      - traefik.http.services.mundial.loadbalancer.server.port=80
    volumes:
      - /var/lib/mundial/media/_fotos_1020304050:/var/www/html/public/fotos:ro
      - /var/lib/mundial/media/CacheFotos:/var/www/html/public/cache
      - /var/lib/mundial/media/pdf_1020304050:/var/lib/mundial/documentos:ro
      # XMLs dos portais enviados pelo ERP via FTP, publicados nos mesmos endereços da DigitalOcean
      - /var/lib/mundial/media/imovelweb:/var/www/html/public/imovelweb:ro
      - /var/lib/mundial/media/zapviva:/var/www/html/public/zapviva:ro
      - /var/lib/mundial/media/casamineira:/var/www/html/public/casamineira:ro
      - /var/lib/mundial/media/chavesnamao:/var/www/html/public/chavesnamao:ro
    networks:
      - mundial_backend
      - mundial_web
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/healthz.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  mundial_backend:
    external: true
  mundial_web:
    external: true
