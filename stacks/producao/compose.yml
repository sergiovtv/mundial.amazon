name: mundial-production

services:
  app:
    build:
      context: ../..
      dockerfile: docker/application/Dockerfile
    container_name: mundial-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MEDIA_BASE_URL: /fotos
      PHOTO_ORIGINAL_ROOT: /var/www/html/public/fotos
      PHOTO_CACHE_ROOT: /var/www/html/public/cache
      PHOTO_WATERMARK_FILE: /var/www/html/public/img/watermark-mundial.png
      APP_URL: ${APP_URL:-https://mundialimoveis.com.br}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: imobi
      DB_USER: ${MUNDIAL_APP_USER}
      DB_PASSWORD: ${MUNDIAL_APP_PASSWORD}
      CLIENT_DB_NAME: cliente
      CLIENT_DOCUMENT_ROOT: /var/lib/mundial/documentos
      BOLETO_API_BASE_URL: ${BOLETO_API_BASE_URL:-http://177.200.69.64:9090/sistema/api/site_api.php}
      BOLETO_API_COMPANY: ${BOLETO_API_COMPANY:-sm}
      BOLETO_API_ROUTINE: ${BOLETO_API_ROUTINE:-pdf_boleto_sicredi}
    ports:
      - "80:80"
    volumes:
      - /var/lib/mundial/media/_fotos_1020304050:/var/www/html/public/fotos:ro
      - /var/lib/mundial/media/CacheFotos:/var/www/html/public/cache
      - /var/lib/mundial/media/pdf_1020304050:/var/lib/mundial/documentos:ro
    networks:
      - mundial_backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/healthz.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  mundial_backend:
    external: true
