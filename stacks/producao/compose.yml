name: mundial-production

services:
  app:
    build:
      context: ../..
      dockerfile: docker/application/Dockerfile
    container_name: mundial-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MEDIA_BASE_URL: /fotos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: imobi
      DB_USER: ${MUNDIAL_APP_USER}
      DB_PASSWORD: ${MUNDIAL_APP_PASSWORD}
    ports:
      - "80:80"
    volumes:
      - /var/lib/mundial/media/_fotos_1020304050:/var/www/html/public/fotos:ro
    networks:
      - mundial_backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/healthz.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  mundial_backend:
    external: true
