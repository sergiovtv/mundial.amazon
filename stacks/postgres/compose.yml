name: mundial-postgres

services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      MUNDIAL_APP_USER: ${MUNDIAL_APP_USER}
      MUNDIAL_APP_PASSWORD: ${MUNDIAL_APP_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${POSTGRES_DATA_DIR:-/var/lib/mundial/postgres}:/var/lib/postgresql/data
    networks:
      - mundial_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 3G
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb

networks:
  mundial_backend:
    external: true

