# O certificado é emitido e renovado pelo resolvedor "letsencrypt" (ver stacks/producao).
# Para uma nova migração, um certificado já existente pode ser usado temporariamente como
# padrão em tls.stores.default.defaultCertificate (arquivos em /certs), removendo-o depois
# da troca do DNS: com ele presente o Traefik não solicita certificado ao Let's Encrypt.
tls:
  options:
    default:
      minVersion: VersionTLS12
