ServerTokens Prod

# Atrás do Traefik: IP real do visitante e HTTPS informados pelo proxy.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
ServerSignature Off

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # URLs do site antigo (DigitalOcean). Imóveis passam por imovel.php, que responde
    # 301 para o endereço canônico; fotos (inclusive as dos XMLs dos portais) vão para
    # a versão com marca d'água, sem expor os originais montados em /fotos.
    RewriteRule ^(?:fotos|fotoszap[0-9]*)/(?:miniatura/)?((?:[0-9]+|Edificios/[0-9]+|Bairros/[0-9]+)/[^/]+)$ foto-legada.php?path=$1 [B,L]
    RewriteRule ^(?:mobile/)?imovel/([0-9]+)(?:-i)?(?:/.*)?$ imovel.php?id=$1 [L]
    RewriteRule ^imovel/[^/]*-([0-9]+)/?$ imovel.php?id=$1 [L]
    RewriteRule ^(?:indique|informacao)/imovel/([0-9]+) imovel.php?id=$1 [L]
    RewriteRule ^(?:procura|condominio|bairro|lancamentos|indique|informacao|fale-conosco|home|mobile)(?:/.*)?$ / [R=301,L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^cliente/(?:area_cliente[^/]*|login\.php|logout\.php|cliente2[^/]*)$ /cliente/ [R=301,L]

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^cache/(.+)$ media.php?path=$1 [L,QSA]
    RewriteRule ^imovel/(comprar|alugar|codigo)/[^/]+/[^/]+/[^/]+/([0-9]+)/?$ imovel.php?id=$2&finalidade=$1 [L,QSA]
    RewriteRule ^sitemap\.xml$ sitemap.php [L]
    RewriteRule ^robots\.txt$ robots.php [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L,QSA]
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
